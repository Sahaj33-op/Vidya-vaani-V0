# Prometheus Configuration for Vidya Vaani

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vidya-vaani-monitor'

scrape_configs:
  # FastAPI Backend Metrics
  - job_name: 'vidya-vaani-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis Metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

# Alerting rules (optional)
rule_files:
  # - 'alert_rules.yml'
